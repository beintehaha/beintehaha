<body>

<h1><a href="index.html">beintehaha</a></h1>
<p class="tagline">Tracking</p>

<p>Starting debt: <strong>$260,000</strong>. Each day's calorie deficit
comes off; each surplus goes on.</p>

<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Weight</th>
      <th>Cal In</th>
      <th>Cal Out</th>
      <th>Deficit</th>
      <th>Protein</th>
      <th>GLP-1</th>
      <th>Debt</th>
    </tr>
  </thead>
  <tbody>
    <!-- Add one row per day, most recent at the bottom.
         Debt = previous day's debt minus this day's deficit
         (a negative deficit, i.e. a surplus, adds to debt). -->
    <tr>
      <td>Sept 18, 2026</td>
      <td>&mdash;</td>
      <td>&mdash;</td>
      <td>&mdash;</td>
      <td>&mdash;</td>
      <td>&mdash;</td>
      <td class="no">&mdash;</td>
      <td>$260,000</td>
    </tr>
  </tbody>
</table>

  beintehaha
</footer>

</body>
</html>
